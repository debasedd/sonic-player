name: Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NSIS
        run: choco install nsis --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build

      - name: Upload installer for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sonic ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Windows installer for Sonic.

            Download the `.exe` installer below and run it. You do not need to build the app yourself.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
